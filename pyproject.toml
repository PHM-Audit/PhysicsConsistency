[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guardrails-physics-consistency"
version = "1.0.0"
description = "Deterministic physics plausibility validator: verifies LLM output text against universal physical laws. Offline, zero-dependency core, reproducible verdicts."
authors = [{ name = "PHM-Audit" }]
license = { text = "MIT" }
requires-python = ">=3.8"
readme = "README.md"
keywords = ["guardrails", "physics", "validation", "llm", "deterministic", "safety"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["guardrails-ai>=0.5.0"]

[project.urls]
Repository = "https://github.com/PHM-Audit/PhysicsConsistency"

[tool.hatch.build.targets.wheel]
packages = ["guardrails_physics_consistency"]
